name: NQT Media Assemble

on:
  push:
    paths:
      - 'nqtdeals/.upload-trigger-ed0003-v2'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble immutable JPEG
        shell: bash
        run: |
          set -euo pipefail
          OUT='nqtdeals/2026/09/NQTD-20260910-2055-ED-0003-v2-720.jpg'
          cat nqtdeals/.tmp/ed0003v2.part* > /tmp/ed0003v2.b64
          base64 --decode /tmp/ed0003v2.b64 > "$OUT"
          test "$(stat -c%s "$OUT")" -eq 63194
          echo 'f679194ea10c91164cd2fe868ec8ad51f82c0576cd46e11737317746b7dd17e2  '"$OUT" | sha256sum -c -
          file "$OUT" | grep -qi 'JPEG image data'
          rm -rf nqtdeals/.tmp nqtdeals/.upload-trigger-ed0003-v2
      - name: Commit final raster
        shell: bash
        run: |
          git config user.name 'nqtbot-media'
          git config user.email 'nqtbot@gmail.com'
          git add -A
          git commit -m 'Add NQT Deals ED-0003 v2 immutable final raster' || exit 0
          git push
