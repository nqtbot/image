name: NQT Media Assemble

on:
  push:
    paths:
      - 'nqtdeals/.upload-trigger-ed0003'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble immutable JPEG
        shell: bash
        run: |
          set -euo pipefail
          OUT='nqtdeals/2026/09/NQTD-20260910-1948-ED-0003-v1.jpg'
          cat nqtdeals/.tmp/ed0003.part* > /tmp/ed0003.b64
          base64 --decode /tmp/ed0003.b64 > "$OUT"
          test "$(stat -c%s "$OUT")" -eq 103969
          echo '9a42bdd87b09d8d2ee0ca0664bba607769f0971cf42cdffca9b174f5b3b130c9  '"$OUT" | sha256sum -c -
          file "$OUT" | grep -qi 'JPEG image data'
          rm -rf nqtdeals/.tmp nqtdeals/.upload-trigger-ed0003
      - name: Commit final raster
        shell: bash
        run: |
          git config user.name 'nqtbot-media'
          git config user.email 'nqtbot@gmail.com'
          git add -A
          git commit -m 'Add NQT Deals ED-0003 immutable final raster' || exit 0
          git push
