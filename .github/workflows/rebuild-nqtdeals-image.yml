name: Rebuild NQT Deals image

on:
  push:
    paths:
      - '.github/workflows/rebuild-nqtdeals-image.yml'
      - 'nqtdeals/_incoming/NQTD-ED-0001-final-8.part*'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify or repair chunks, then rebuild PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          base = Path('nqtdeals/_incoming')
          specs = [
              ('NQTD-ED-0001-final-8.part01', 4000, '9111cd85a5e87fcc4b44576ad80958100fa086b51f9b450888195d0ede6d7f5d'),
              ('NQTD-ED-0001-final-8.part02', 4000, '84d66aec5bf7433ff91d2cf3a4c44453eaf5a5e479a9679008b5dd606e2ce6e3'),
              ('NQTD-ED-0001-final-8.part03', 4000, 'ff79e4005fa3d4cb10f7f401f8dae41fbd2d86549a3b69fbeefaadd102af3dfc'),
              ('NQTD-ED-0001-final-8.part04', 4000, '6017965eee2fc25410edee77ad3c436c9e0d1c0b29193daa8b55aa25e8e66355'),
              ('NQTD-ED-0001-final-8.part05a', 2000, '0c69d7f966873935da58b9298c7a79bdfe41203964c3b147be1a54c3d1377e65'),
              ('NQTD-ED-0001-final-8.part05b', 2000, '483413349dcfbd6d5b13e31096412cbb4d5b8af202d0f40c92cb351d8cc2f3f2'),
              ('NQTD-ED-0001-final-8.part06', 4000, 'a2c05ffa83b0c309a27c6a18f9f3ebe0510f0c93f8ed935710dd092688e0e511'),
              ('NQTD-ED-0001-final-8.part07', 4000, 'b3464d0f101fe81ee3df59890c54ba5c7f62e43bfadbd1ccb676682786cd708c'),
              ('NQTD-ED-0001-final-8.part08', 2900, '1446a149a537dd19eba8a37a8bec95e4e59c21baea99781f9b9e3e285603a681'),
          ]
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def digest(x):
              return hashlib.sha256(x).hexdigest()

          def repair(data, expected_len, expected_hash):
              if len(data) == expected_len - 1:
                  for pos in range(expected_len):
                      for c in alphabet:
                          candidate = data[:pos] + bytes([c]) + data[pos:]
                          if digest(candidate) == expected_hash:
                              return candidate
              elif len(data) == expected_len:
                  for pos in range(expected_len):
                      original = data[pos]
                      for c in alphabet:
                          if c == original:
                              continue
                          candidate = data[:pos] + bytes([c]) + data[pos+1:]
                          if digest(candidate) == expected_hash:
                              return candidate
              elif len(data) == expected_len + 1:
                  for pos in range(len(data)):
                      candidate = data[:pos] + data[pos+1:]
                      if digest(candidate) == expected_hash:
                          return candidate
              return None

          rebuilt_parts = []
          for name, expected_len, expected_hash in specs:
              p = base / name
              data = p.read_bytes()
              actual = digest(data)
              if len(data) == expected_len and actual == expected_hash:
                  print(f'PASS {name}: {len(data)} bytes')
                  rebuilt_parts.append(data)
                  continue
              print(f'REPAIR {name}: got {len(data)} bytes {actual}')
              fixed = repair(data, expected_len, expected_hash)
              if fixed is None:
                  raise SystemExit(f'Cannot repair {name}')
              print(f'REPAIRED {name}: {len(fixed)} bytes')
              rebuilt_parts.append(fixed)

          b64 = b''.join(rebuilt_parts)
          assert len(b64) == 30900, len(b64)
          assert digest(b64) == '7f1c155f38597b3ee2f47f1790c3c6825554a863442e7e44790ecbc3469e3450'
          import base64
          png = base64.b64decode(b64, validate=True)
          assert len(png) == 23175, len(png)
          assert digest(png) == '56409f95ae9330586d18ad52bb2cb1a52752fa02228824903486d5af7e955561'
          out = Path('nqtdeals/2026/09/NQTD-ED-0001-final-8.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(png)
          print('FULL_IMAGE_VERIFIED 23175 bytes SHA256=56409f95ae9330586d18ad52bb2cb1a52752fa02228824903486d5af7e955561')
          PY

      - name: Commit rebuilt image
        shell: bash
        run: |
          git config user.name "nqtbot"
          git config user.email "nqtbot@users.noreply.github.com"
          git add nqtdeals/2026/09/NQTD-ED-0001-final-8.png
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild full NQT Deals publish image"
          git push
