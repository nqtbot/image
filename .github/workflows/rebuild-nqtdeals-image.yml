name: Rebuild NQT Deals image

on:
  push:
    paths:
      - '.github/workflows/rebuild-nqtdeals-image.yml'
      - 'nqtdeals/_incoming/NQTD-ED-0001-final-8.part*'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify chunks and rebuild PNG
        shell: bash
        run: |
          check() { f="$1"; h="$2"; echo "$f: $(wc -c < "$f") bytes $(sha256sum "$f" | cut -d' ' -f1)"; test "$(sha256sum "$f" | cut -d' ' -f1)" = "$h"; }
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part01 9111cd85a5e87fcc4b44576ad80958100fa086b51f9b450888195d0ede6d7f5d
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part02 84d66aec5bf7433ff91d2cf3a4c44453eaf5a5e479a9679008b5dd606e2ce6e3
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part03 ff79e4005fa3d4cb10f7f401f8dae41fbd2d86549a3b69fbeefaadd102af3dfc
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part04 6017965eee2fc25410edee77ad3c436c9e0d1c0b29193daa8b55aa25e8e66355
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part05a 0c69d7f966873935da58b9298c7a79bdfe41203964c3b147be1a54c3d1377e65
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part05b 483413349dcfbd6d5b13e31096412cbb4d5b8af202d0f40c92cb351d8cc2f3f2
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part06 a2c05ffa83b0c309a27c6a18f9f3ebe0510f0c93f8ed935710dd092688e0e511
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part07 b3464d0f101fe81ee3df59890c54ba5c7f62e43bfadbd1ccb676682786cd708c
          check nqtdeals/_incoming/NQTD-ED-0001-final-8.part08 1446a149a537dd19eba8a37a8bec95e4e59c21baea99781f9b9e3e285603a681
          cat \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part01 \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part02 \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part03 \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part04 \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part05a \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part05b \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part06 \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part07 \
            nqtdeals/_incoming/NQTD-ED-0001-final-8.part08 > /tmp/nqtd.b64
          test "$(wc -c < /tmp/nqtd.b64)" -eq 30900
          test "$(sha256sum /tmp/nqtd.b64 | cut -d' ' -f1)" = "7f1c155f38597b3ee2f47f1790c3c6825554a863442e7e44790ecbc3469e3450"
          base64 -d /tmp/nqtd.b64 > nqtdeals/2026/09/NQTD-ED-0001-final-8.png
          test "$(wc -c < nqtdeals/2026/09/NQTD-ED-0001-final-8.png)" -eq 23175
          test "$(sha256sum nqtdeals/2026/09/NQTD-ED-0001-final-8.png | cut -d' ' -f1)" = "56409f95ae9330586d18ad52bb2cb1a52752fa02228824903486d5af7e955561"

      - name: Commit rebuilt image
        shell: bash
        run: |
          git config user.name "nqtbot"
          git config user.email "nqtbot@users.noreply.github.com"
          git add nqtdeals/2026/09/NQTD-ED-0001-final-8.png
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild full NQT Deals publish image"
          git push
